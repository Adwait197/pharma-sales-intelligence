version: 2

seeds:
  - name: market_basket
    description: Hand-maintained GLP-1 market definition. Maps each CMS brand name to a brand family, molecule, manufacturer and market segment.
    columns:
      - name: brand_name
        description: CMS brand name, spelled exactly as in the source data.
        data_tests:
          - unique
          - not_null
      - name: market_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['glp1_diabetes', 'glp1_obesity', 'glp1_insulin_combo']

  - name: state_regions
    description: US Census Bureau regions and divisions for the 50 states and DC.
    config:
      column_types:
        state_fips: text
    columns:
      - name: state_fips
        description: Two-digit state FIPS code, stored as text to keep the leading zero.
        data_tests:
          - unique
          - not_null
      - name: census_region
        data_tests:
          - accepted_values:
              arguments:
                values: ['Northeast', 'Midwest', 'South', 'West']
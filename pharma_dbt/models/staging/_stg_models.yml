version: 2

models:
  - name: stg_geography_drug
    description: Typed and renamed CMS geography-and-drug data. One row per year, geography, brand name and generic name. No rows removed.
    columns:
      - name: data_year
        data_tests:
          - not_null
      - name: geo_level
        description: National or State. Every drug has one National row plus one row per state, so never sum both levels together.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['National', 'State']
      - name: geo_name
        description: >
          State name, or National. 29 state-level rows (27 in 2020, 1 in 2023,
          1 in 2024) have no state code or name in the CMS source. They total
          about 1,700 claims and include no GLP-1 drugs. Kept in staging,
          excluded from state comparisons in the marts.
        data_tests:
          - not_null:
              config:
                warn_if: ">0"
                error_if: ">100"
      - name: brand_name
        data_tests:
          - not_null
      - name: total_claims
        description: Total claims including refills. This is the TRx measure.
        data_tests:
          - not_null